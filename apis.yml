name: Natoma
description: 'Natoma is an enterprise Model Context Protocol (MCP) platform that lets
  organizations securely connect AI agents and assistants (ChatGPT, Claude, Cursor,
  and internal agents) to company data and business tools. It provides one-click deployment
  of managed and remote MCP servers, a catalog of 100+ verified MCP server connectors
  with automatic authentication, centralized identity-aware access controls, role-based
  tool profiles, shadow-AI discovery, and audit trails with SIEM integration. Natoma
  is a cybersecurity company backed by Greylock, Index Ventures, and Norwest Venture
  Partners. It is SOC 2 certified and GDPR/CCPA compliant, with SSO/SCIM provisioning
  via Microsoft Entra and Okta and on-premises deployment options.'
